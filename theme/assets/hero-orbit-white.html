<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero Animation — Orbiting Trio (white)</title>
<style>
  html,
  body {
    height: 100%;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage {
    position: relative;
    aspect-ratio: 1 / 1;
    width: min(100%, 620px);
    max-width: 620px;
    margin: 0 auto;
  }
  .stage svg { width: 100%; height: 100%; overflow: visible; }

  /* ============================================================
     ORBIT SYSTEM
     ============================================================ */
  @keyframes spin-cw  { to { transform: rotate(360deg);  } }
  @keyframes spin-ccw { to { transform: rotate(-360deg); } }

  .orbit {
    transform-box: view-box;
    transform-origin: 300px 300px;
    animation: spin-cw 28s linear infinite;
  }
  .upright-top { transform-box: view-box; transform-origin: 300px 100px; animation: spin-ccw 28s linear infinite; }
  .upright-br  { transform-box: view-box; transform-origin: 473px 400px; animation: spin-ccw 28s linear infinite; }
  .upright-bl  { transform-box: view-box; transform-origin: 127px 400px; animation: spin-ccw 28s linear infinite; }

  /* ============================================================
     CENTER — heartbeat + pulsing ring
     ============================================================ */
  @keyframes pulse {
    0%, 100% { transform: scale(1);    opacity: .45; }
    50%      { transform: scale(1.06); opacity: .18; }
  }
  .ring {
    transform-box: view-box;
    transform-origin: 300px 300px;
    animation: pulse 4.4s ease-in-out infinite;
  }

  @keyframes trace {
    0%   { stroke-dashoffset: 600; }
    55%  { stroke-dashoffset: 0;   }
    100% { stroke-dashoffset: -600;}
  }
  .hb-trace {
    stroke-dasharray: 600;
    animation: trace 4.5s cubic-bezier(.6,.05,.35,1) infinite;
  }

  @keyframes blip { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .hb-dot { animation: blip 1.1s ease-in-out infinite; }

  /* ============================================================
     FIGURE A — Kettlebell swing  (top)
     ============================================================ */
  @keyframes swing { 0%,100% { transform: rotate(-50deg); } 50% { transform: rotate(50deg); } }
  @keyframes squat { 0%,100% { transform: translateY(0);  } 50% { transform: translateY(4px); } }

  .kb-figure { transform-box: view-box; transform-origin: 300px 110px; animation: squat 2.2s ease-in-out infinite; }
  .kb-arm    { transform-box: view-box; transform-origin: 300px 85px;  animation: swing 2.2s ease-in-out infinite; }

  /* ============================================================
     FIGURE B — Jump rope  (bottom-right)
     ============================================================ */
  @keyframes hop      { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes ropeFlip { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(-1); } }

  .jr-figure { transform-box: view-box; transform-origin: 473px 400px; animation: hop 0.9s ease-in-out infinite; }
  .jr-rope   { transform-box: view-box; transform-origin: 473px 410px; animation: ropeFlip 0.9s ease-in-out infinite; }

  /* ============================================================
     FIGURE C — Barbell lift  (bottom-left)
     ============================================================ */
  @keyframes lift    { 0%,100% { transform: translateY(14px); } 50% { transform: translateY(-12px); } }
  @keyframes breathe { 0%,100% { transform: scale(1);         } 50% { transform: scale(1.03);       } }

  .bb-fig { transform-box: view-box; transform-origin: 127px 425px; animation: breathe 3s ease-in-out infinite; }
  .bb-bar { transform-box: view-box; transform-origin: 127px 400px; animation: lift 3s ease-in-out infinite; }

  /* ============================================================
     SVG colors — single source of truth
     ============================================================ */
  .stage svg { color: #ffffff; } /* not used for stroke directly; we set explicitly below */

  .stroke-line { stroke: #ffffff; }
  .fill-solid  { fill: #ffffff; }
  .stroke-faint{ stroke: #ffffff; opacity: .25; }
  .stroke-dashed{ stroke: #ffffff; opacity: .18; }
  .stroke-baseline{ stroke: #ffffff; opacity: .15; }
</style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <svg viewBox="0 0 600 600">

        <!-- Faint orbital path -->
        <circle cx="300" cy="300" r="200" fill="none"
                class="stroke-dashed" stroke-width="1" stroke-dasharray="2 6"/>

        <!-- Pulsing center ring -->
        <circle class="ring stroke-faint" cx="300" cy="300" r="100"
                fill="none" stroke-width="1"/>

        <!-- Heartbeat ECG (center, stationary) -->
        <g>
          <line x1="210" y1="300" x2="390" y2="300"
                class="stroke-baseline" stroke-width="1"/>
          <path class="hb-trace stroke-line"
                d="M215 300 L260 300 L275 270 L295 340 L315 240 L335 340 L355 300 L385 300"
                fill="none" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="hb-dot fill-solid" cx="315" cy="240" r="4"/>
        </g>

        <!-- Orbiting trio -->
        <g class="orbit">

          <!-- ===== Top: Kettlebell swing (300, 100) ===== -->
          <g class="upright-top">
            <g class="kb-figure">
              <circle cx="300" cy="65" r="8" class="fill-solid"/>
              <line x1="300" y1="73"  x2="300" y2="125" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="300" y1="125" x2="287" y2="160" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="300" y1="125" x2="313" y2="160" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g class="kb-arm">
              <line x1="300" y1="85" x2="300" y2="130" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <circle cx="300" cy="143" r="11" class="fill-solid"/>
              <rect x="294" y="130" width="12" height="5" class="fill-solid"/>
            </g>
          </g>

          <!-- ===== Bottom-right: Jump rope (473, 400) ===== -->
          <g class="upright-br">
            <path class="jr-rope stroke-line"
                  d="M450 410 Q473 455 496 410"
                  fill="none" stroke-width="2" stroke-linecap="round"/>
            <g class="jr-figure">
              <circle cx="473" cy="365" r="8" class="fill-solid"/>
              <line x1="473" y1="373" x2="473" y2="420" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="473" y1="390" x2="455" y2="408" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="473" y1="390" x2="491" y2="408" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="473" y1="420" x2="463" y2="455" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="473" y1="420" x2="483" y2="455" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
            </g>
          </g>

          <!-- ===== Bottom-left: Barbell lift (127, 400) ===== -->
          <g class="upright-bl">
            <g class="bb-fig">
              <circle cx="127" cy="365" r="8" class="fill-solid"/>
              <line x1="127" y1="373" x2="127" y2="425" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="127" y1="425" x2="115" y2="465" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="127" y1="425" x2="139" y2="465" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
              <line x1="127" y1="395" x2="127" y2="408" class="stroke-line" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g class="bb-bar">
              <line x1="80"  y1="395" x2="174" y2="395" class="stroke-line" stroke-width="3" stroke-linecap="round"/>
              <rect x="73"  y="384" width="6" height="22" class="fill-solid"/>
              <rect x="175" y="384" width="6" height="22" class="fill-solid"/>
              <rect x="64"  y="378" width="6" height="34" class="fill-solid"/>
              <rect x="184" y="378" width="6" height="34" class="fill-solid"/>
            </g>
          </g>

        </g>
    </svg>
  </div>
</body>
</html>
